<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="theme-color" content="#00050d"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"/>
<title>ابحث عن شريك — شريك</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../home/home.css"/>
</head>
<body data-page="search">

<div class="page-bar">
  <a href="../index.html" class="btn btn-quiet"><i data-lucide="arrow-right"></i> رجوع</a>
  <div class="page-title">ابحث عن شريك</div>
  <a href="../dashboard/dashboard.html" class="icon-btn" aria-label="لوحتي"><i data-lucide="inbox"></i></a>
</div>

<main class="wrap search-main">
  <div class="sec-head" style="margin-bottom:24px"><h2>ما الذي تبحث عنه اليوم؟</h2><p>اختر: هل ترغب في الانضمام إلى مشروع، أم في عرض نفسك كشريك متاح؟</p></div>

  <div class="seg" id="searchTabs" style="margin-bottom:20px">
    <button type="button" class="seg-btn active" data-tab="teams"><i data-lucide="rocket"></i> مشاريع تحتاج فريقًا</button>
    <button type="button" class="seg-btn" data-tab="partners"><i data-lucide="user"></i> شركاء متاحون</button>
  </div>

  <section class="toolbar">
    <label class="search"><i data-lucide="search"></i><input id="q" type="text" placeholder="ابحث بكلمة…"/></label>
    
    <!-- ★ قائمة الفلتر الجديدة حسب النوع ★ -->
    <div class="select">
      <select id="fType" class="input">
        <option value="all">كل الأنواع</option>
        <option value="مذكرة تخرج">مذكرة تخرج</option>
        <option value="شركة ناشئة">شركة ناشئة</option>
        <option value="مشروع خارج الجامعة">مشروع خارج الجامعة</option>
        <option value="مسابقة / بحث علمي">مسابقة / بحث علمي</option>
        <option value="مبادرة خيرية">مبادرة خيرية</option>
      </select>
      <i data-lucide="chevron-down"></i>
    </div>

    <div class="select"><select id="fFaculty" class="input"></select><i data-lucide="chevron-down"></i></div>
    <div class="select"><select id="fSort" class="input"><option value="newest">الأحدث</option><option value="oldest">الأقدم</option><option value="needed">الأكثر حاجةً</option></select><i data-lucide="chevron-down"></i></div>
  </section>

  <div class="chips-scroll" id="specChips"></div>
  <p class="results-count" id="count"></p>
  <section class="grid" id="results"></section>
</main>

<div class="modal" id="reqModal">
  <div class="modal-card">
    <div class="modal-head"><h2><i data-lucide="send"></i> أرسل طلبًا</h2><button type="button" class="icon-btn" data-close><i data-lucide="x"></i></button></div>
    <div class="note"><i data-lucide="shield-lock"></i><span>تُرسل بياناتك كطلب، ولا يراها الطرف الآخر إلا إذا قبلها من لوحته.</span></div>
    <p style="color:var(--ink-2);font-size:.92rem">إلى: <b id="reqTo" style="color:var(--ink)"></b></p>
    <label class="field"><span class="field-label">رسالتك *</span><textarea id="reqMsg" class="input" rows="3" required placeholder="عرّف بتخصّصك وما يمكنك تقديمه…"></textarea></label>
    <button id="sendReq" type="button" class="btn btn-primary btn-block"><i data-lucide="send"></i> أرسل الطلب</button>
    <p class="tiny">ألستَ تملك ملفًّا بعد؟ <a href="../register/register.html">سجّل أولًا</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../home/home.js"></script>
</body>
</html>
